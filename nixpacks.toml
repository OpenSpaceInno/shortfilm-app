# ==============================================================================
# Nixpacks Configuration for Coolify
# ==============================================================================
[phases.setup]
nixPkgs = ["bun", "nodejs_20"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "bun run preview --host 0.0.0.0 --port ${PORT:-80}"
