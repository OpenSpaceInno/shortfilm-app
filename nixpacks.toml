# ==============================================================================
# Nixpacks Configuration for Coolify
# ==============================================================================
[variables]
NITRO_PRESET = "node-server"
NITRO_HOST = "0.0.0.0"
HOST = "0.0.0.0"
NODE_ENV = "production"

[phases.setup]
nixPkgs = ["bun", "nodejs_20"]

[phases.install]
cmds = ["bun install --frozen-lockfile"]

[phases.build]
cmds = ["bun run build"]

[start]
cmd = "node .output/server/index.mjs"
