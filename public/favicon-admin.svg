<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="adminBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="adminGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="adminGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#f59e0b" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Executive Slate/Gold border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#adminBg)" stroke="url(#adminGold)" stroke-width="2.5"/>

  <!-- Master Command Shield Outline -->
  <path d="M 32 10 L 49 16 C 49 32, 40 46, 32 52 C 24 46, 15 32, 15 16 Z"
        fill="url(#shieldFill)"
        stroke="url(#adminGold)"
        stroke-width="2"
        filter="url(#adminGlow)" />

  <!-- Inner Admin Controls / Sliders -->
  <!-- Horizontal control track 1 -->
  <line x1="22" y1="23" x2="42" y2="23" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="28" cy="23" r="3.2" fill="#fbbf24"/>

  <!-- Horizontal control track 2 -->
  <line x1="22" y1="31" x2="42" y2="31" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="36" cy="31" r="3.2" fill="#fbbf24"/>

  <!-- Horizontal control track 3 -->
  <line x1="24" y1="39" x2="40" y2="39" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="30" cy="39" r="3.2" fill="#fbbf24"/>

  <!-- Authority Star/Spark at Top Center -->
  <polygon points="32,13 33.5,16.5 37,17 34.3,19.5 35,23 32,21.2 29,23 29.7,19.5 27,17 30.5,16.5" fill="#fef08a"/>
</svg>
